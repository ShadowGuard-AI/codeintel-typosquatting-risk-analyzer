<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The tide mill in three bands: the mill roof and the sea beyond the bank brightening slowly, the wheel turning slowly on its fixed axle while the sluice gate holds raised, and a thin sheet of water withdrawing along the ebb channel in the mud">
